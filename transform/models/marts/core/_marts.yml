version: 2

models:
  - name: country_daily_enriched
    description: >
      Gold mart: one row per (country, date) with cases/deaths,
      vaccination progress, and demographic/economic context. Primary
      table queried by the FastAPI backend (Task 4) and the dashboard
      (Task 5).
    columns:
      - name: iso_code
        tests: [not_null]
      - name: report_date
        tests: [not_null]
      - name: case_fatality_rate
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
              config:
                severity: warn
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [iso_code, report_date]

  - name: jhu_who_cross_check
    description: >
      Gold mart: JHU vs. WHO case/death counts for the same
      (country, date), with the difference computed -- a data-quality/
      insight table, not something the API necessarily serves directly.
