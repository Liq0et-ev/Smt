version: 2

models:
  - name: country_daily_enriched
    description: >
      Gold mart: one row per (country, date) with cases/deaths,
      vaccination progress, mobility, and demographic/economic context.
      Primary table queried by the FastAPI backend (Task 4) and the
      dashboard (Task 5).
    columns:
      - name: country_name
        tests: [not_null]
      - name: report_date
        tests: [not_null]
      - name: case_fatality_rate
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 1
              config:
                severity: warn
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [country_name, report_date]
