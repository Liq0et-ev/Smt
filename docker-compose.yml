services:
  mongo:
    image: mongo:7
    container_name: covid_platform_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: covid_platform_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Overrides whatever host path is in .env -- inside the container
      # the key is always mounted at this fixed path (see volumes: below).
      SNOWFLAKE_PRIVATE_KEY_PATH: /run/secrets/snowflake_rsa_key.p8
      MONGO_URI: mongodb://mongo:27017
    volumes:
      - ${SNOWFLAKE_PRIVATE_KEY_PATH}:/run/secrets/snowflake_rsa_key.p8:ro
    depends_on:
      mongo:
        condition: service_healthy

  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    container_name: covid_platform_dashboard
    restart: unless-stopped
    ports:
      - "8050:8050"
    environment:
      # Talks to the API container directly over Docker's internal
      # network, not localhost -- same pattern as MONGO_URI above.
      API_BASE_URL: http://api:8000
    depends_on:
      - api

# mongo-express (optional NoSQL admin UI) can be added in Task 10 if useful.

volumes:
  mongo-data:
